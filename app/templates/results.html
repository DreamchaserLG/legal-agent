{% extends "base.html" %}

{% block title %}{{ app_name }} | {{ tr('results.kicker') }}{% endblock %}

{% block content %}
<link rel="stylesheet" href="/static/react/legal-relations.css?v=20261029" />
<div data-results-react-root data-payload="results-react-data">
    <div class="shell lr-empty">{{ tr('facet.loading') }}</div>
</div>
<script id="results-react-data" type="application/json">{{ {
    "lang": lang,
    "keywords": keywords_input,
    "modulePacket": module_packet or {},
    "moduleCode": module_code,
    "source": source,
    "sort": sort,
    "limit": limit,
    "offset": offset,
    "searchStrategy": search_strategy or "local_only",
    "intentHint": intent_hint or none
} | tojson }}</script>
<script type="module" src="/static/react/legal-relations.js?v=20261029"></script>
{% endblock %}

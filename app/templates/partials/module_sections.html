{% if module_packet %}
<link rel="stylesheet" href="/static/react/legal-relations.css?v=20261029" />
<section class="band">
    <div class="shell">
        <div data-legal-relations-root data-payload="legal-relations-data">
            <div class="lr-empty">{{ tr('facet.loading') }}</div>
        </div>
    </div>
</section>
<script id="legal-relations-data" type="application/json">{{ {
    "lang": lang,
    "modulePacket": module_packet or {},
    "supplementalLaws": linked_laws if linked_laws is defined else [],
    "supplementalCases": supporting_case_groups if supporting_case_groups is defined else []
} | tojson }}</script>
<script type="module" src="/static/react/legal-relations.js?v=20261029"></script>
{% endif %}
